<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520">
  <rect width="1100" height="520" rx="18" fill="#071016" stroke="#16443f" stroke-width="2"/>
  
  <!-- Header -->
  <text x="40" y="45" fill="#eafff8" font-family="DejaVu Sans, sans-serif" font-weight="700" font-size="26">RIDESHIELD / SYSTEM MAP</text>
  <text x="40" y="72" fill="#6faaa0" font-family="DejaVu Sans Mono, monospace" font-size="12">EDGE → API → EVENT PIPELINE → EVIDENCE → HUMAN DECISION</text>
  
  <!-- Row 1 Boxes -->
  <!-- Rider App -->
  <rect x="55" y="120" width="220" height="95" rx="14" fill="#09181a" stroke="#29e6a3" stroke-width="2"/>
  <text x="70" y="148" fill="#29e6a3" font-family="DejaVu Sans, sans-serif" font-weight="700" font-size="16">RIDER APP</text>
  <text x="70" y="171" fill="#7aa79e" font-family="DejaVu Sans Mono, monospace" font-size="11">
    <tspan x="70" dy="0">GPS • ACCEL • GYRO</tspan>
    <tspan x="70" dy="16">EDGE CRASH FILTER</tspan>
  </text>
  
  <!-- FastAPI -->
  <rect x="330" y="120" width="210" height="95" rx="14" fill="#09181a" stroke="#45c7f0" stroke-width="2"/>
  <text x="345" y="148" fill="#45c7f0" font-family="DejaVu Sans, sans-serif" font-weight="700" font-size="16">FASTAPI</text>
  <text x="345" y="171" fill="#7aa79e" font-family="DejaVu Sans Mono, monospace" font-size="11">
    <tspan x="345" dy="0">JWT • SHIFTS • CLAIMS</tspan>
    <tspan x="345" dy="16">REST ORCHESTRATION</tspan>
  </text>
  
  <!-- Redis / Worker -->
  <rect x="605" y="105" width="180" height="125" rx="14" fill="#09181a" stroke="#eabf62" stroke-width="2"/>
  <text x="620" y="133" fill="#eabf62" font-family="DejaVu Sans, sans-serif" font-weight="700" font-size="16">REDIS / WORKER</text>
  <text x="620" y="156" fill="#7aa79e" font-family="DejaVu Sans Mono, monospace" font-size="11">
    <tspan x="620" dy="0">XADD • XREADGROUP</tspan>
    <tspan x="620" dy="16">XACK AFTER COMMIT</tspan>
    <tspan x="620" dy="16">XAUTOCLAIM</tspan>
  </text>
  
  <!-- Postgres / Neon -->
  <rect x="850" y="120" width="190" height="95" rx="14" fill="#09181a" stroke="#b39cff" stroke-width="2"/>
  <text x="865" y="148" fill="#b39cff" font-family="DejaVu Sans, sans-serif" font-weight="700" font-size="16">POSTGRES / NEON</text>
  <text x="865" y="171" fill="#7aa79e" font-family="DejaVu Sans Mono, monospace" font-size="11">
    <tspan x="865" dy="0">USERS • SHIFTS</tspan>
    <tspan x="865" dy="16">CLAIMS • PAYMENTS</tspan>
  </text>
  
  <!-- Row 2 Boxes -->
  <!-- Risk + Crash -->
  <rect x="330" y="290" width="210" height="95" rx="14" fill="#09181a" stroke="#5dd39e" stroke-width="2"/>
  <text x="345" y="318" fill="#5dd39e" font-family="DejaVu Sans, sans-serif" font-weight="700" font-size="16">RISK + CRASH</text>
  <text x="345" y="341" fill="#7aa79e" font-family="DejaVu Sans Mono, monospace" font-size="11">
    <tspan x="345" dy="0">XGBOOST SIGNALS</tspan>
    <tspan x="345" dy="16">RISK / EVENT CLASS</tspan>
  </text>
  
  <!-- Evidence Engine -->
  <rect x="605" y="280" width="180" height="115" rx="14" fill="#09181a" stroke="#fb7185" stroke-width="2"/>
  <text x="620" y="308" fill="#fb7185" font-family="DejaVu Sans, sans-serif" font-weight="700" font-size="16">EVIDENCE ENGINE</text>
  <text x="620" y="331" fill="#7aa79e" font-family="DejaVu Sans Mono, monospace" font-size="11">
    <tspan x="620" dy="0">6-FACTOR SCORE</tspan>
    <tspan x="620" dy="16">0–100 • PERSISTED</tspan>
  </text>
  
  <!-- Insurer Portal -->
  <rect x="850" y="280" width="190" height="95" rx="14" fill="#09181a" stroke="#45c7f0" stroke-width="2"/>
  <text x="865" y="308" fill="#45c7f0" font-family="DejaVu Sans, sans-serif" font-weight="700" font-size="16">INSURER PORTAL</text>
  <text x="865" y="331" fill="#7aa79e" font-family="DejaVu Sans Mono, monospace" font-size="11">
    <tspan x="865" dy="0">INVESTIGATE</tspan>
    <tspan x="865" dy="16">APPROVE / REJECT</tspan>
  </text>
  
  <!-- Connectors -->
  <!-- Row 1 Horizontal -->
  <line x1="275" y1="167" x2="330" y2="167" stroke="#325f59" stroke-width="3"/>
  <polygon points="330,167 320,161 320,173" fill="#325f59"/>
  
  <line x1="540" y1="167" x2="605" y2="167" stroke="#325f59" stroke-width="3"/>
  <polygon points="605,167 595,161 595,173" fill="#325f59"/>
  
  <line x1="785" y1="167" x2="850" y2="167" stroke="#325f59" stroke-width="3"/>
  <polygon points="850,167 840,161 840,173" fill="#325f59"/>
  
  <!-- Vertical -->
  <line x1="435" y1="215" x2="435" y2="290" stroke="#325f59" stroke-width="3"/>
  <polygon points="435,290 429,280 441,280" fill="#325f59"/>
  
  <line x1="692" y1="230" x2="692" y2="280" stroke="#325f59" stroke-width="3"/>
  <polygon points="692,280 686,270 698,270" fill="#325f59"/>
  
  <!-- Row 2 Horizontal -->
  <line x1="605" y1="337" x2="540" y2="337" stroke="#325f59" stroke-width="3"/>
  <polygon points="540,337 550,331 550,343" fill="#325f59"/>
  
  <line x1="785" y1="337" x2="850" y2="337" stroke="#325f59" stroke-width="3"/>
  <polygon points="850,337 840,331 840,343" fill="#325f59"/>
  
  <!-- Footer text -->
  <text x="60" y="450" fill="#5f938a" font-family="DejaVu Sans Mono, monospace" font-size="12">External services: Razorpay • Twilio / WhatsApp • OpenStreetMap / Overpass</text>
  <text x="60" y="474" fill="#5f938a" font-family="DejaVu Sans Mono, monospace" font-size="12">Database truth lives in PostgreSQL / Neon • event truth flows through Redis</text>
</svg>