<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="480" viewBox="0 0 1100 480">
<defs>
  <linearGradient id="bg" x1="0" x2="1"><stop stop-color="#071016"/><stop offset="1" stop-color="#0a1618"/></linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1100" height="480" rx="18" fill="url(#bg)" stroke="#16443f" stroke-width="2"/>

<!-- Header -->
<text x="42" y="52" fill="#eafff8" font-family="DejaVu Sans, sans-serif" font-weight="700" font-size="24">EVIDENCE VERIFICATION / 100-POINT MODEL</text>
<text x="42" y="78" fill="#6faaa0" font-family="DejaVu Sans Mono, monospace" font-size="12">SERVER-AUTHORITATIVE • EXPLAINABLE • MULTI-DOCUMENT</text>

<!-- Factor 1: Patient Identity (30 max) -->
<text x="42" y="118" fill="#c7e4dd" font-family="DejaVu Sans Mono, monospace" font-size="13">PATIENT IDENTITY</text>
<rect x="42" y="128" width="630" height="16" rx="8" fill="#0e2224"/>
<rect x="42" y="128" width="630" height="16" rx="8" fill="#29e6a3"/>
<text x="686" y="142" fill="#29e6a3" font-family="DejaVu Sans Mono, monospace" font-weight="700" font-size="15">30 / 30 pts</text>

<!-- Factor 2: Incident Time (20 max) -->
<text x="42" y="168" fill="#c7e4dd" font-family="DejaVu Sans Mono, monospace" font-size="13">INCIDENT TIME</text>
<rect x="42" y="178" width="630" height="16" rx="8" fill="#0e2224"/>
<rect x="42" y="178" width="630" height="16" rx="8" fill="#45c7f0"/>
<text x="686" y="192" fill="#45c7f0" font-family="DejaVu Sans Mono, monospace" font-weight="700" font-size="15">20 / 20 pts</text>

<!-- Factor 3: Locality (15 max) -->
<text x="42" y="218" fill="#c7e4dd" font-family="DejaVu Sans Mono, monospace" font-size="13">LOCALITY</text>
<rect x="42" y="228" width="630" height="16" rx="8" fill="#0e2224"/>
<rect x="42" y="228" width="630" height="16" rx="8" fill="#5dd39e"/>
<text x="686" y="242" fill="#5dd39e" font-family="DejaVu Sans Mono, monospace" font-weight="700" font-size="15">15 / 15 pts</text>

<!-- Factor 4: Document Completeness (15 max) -->
<text x="42" y="268" fill="#c7e4dd" font-family="DejaVu Sans Mono, monospace" font-size="13">DOCUMENT COMPLETENESS</text>
<rect x="42" y="278" width="630" height="16" rx="8" fill="#0e2224"/>
<rect x="42" y="278" width="504" height="16" rx="8" fill="#eabf62"/>
<text x="686" y="292" fill="#eabf62" font-family="DejaVu Sans Mono, monospace" font-weight="700" font-size="15">12 / 15 pts</text>

<!-- Factor 5: Diagnosis Consistency (10 max) -->
<text x="42" y="318" fill="#c7e4dd" font-family="DejaVu Sans Mono, monospace" font-size="13">DIAGNOSIS CONSISTENCY</text>
<rect x="42" y="328" width="630" height="16" rx="8" fill="#0e2224"/>
<rect x="42" y="328" width="630" height="16" rx="8" fill="#b39cff"/>
<text x="686" y="342" fill="#b39cff" font-family="DejaVu Sans Mono, monospace" font-weight="700" font-size="15">10 / 10 pts</text>

<!-- Factor 6: Claim Metadata (10 max) -->
<text x="42" y="368" fill="#c7e4dd" font-family="DejaVu Sans Mono, monospace" font-size="13">CLAIM METADATA</text>
<rect x="42" y="378" width="630" height="16" rx="8" fill="#0e2224"/>
<rect x="42" y="378" width="0" height="16" rx="8" fill="#fb7185"/>
<text x="686" y="392" fill="#fb7185" font-family="DejaVu Sans Mono, monospace" font-weight="700" font-size="15"> 0 / 10 pts</text>

<!-- Circular Gauge (Score: 87 / 100) -->
<g transform="translate(940, 248)">
  <circle cx="0" cy="0" r="92" fill="none" stroke="#102b2a" stroke-width="16"/>
  <!-- Arc for 87% (approx 313 degrees, stroke-dasharray="503 75") -->
  <circle cx="0" cy="0" r="92" fill="none" stroke="#29e6a3" stroke-width="16" 
          stroke-dasharray="503 75" stroke-dashoffset="144" stroke-linecap="round" filter="url(#glow)"/>
  
  <text x="0" y="-35" text-anchor="middle" fill="#6faaa0" font-family="DejaVu Sans Mono, monospace" font-size="12" letter-spacing="1">OVERALL SCORE</text>
  <text x="0" y="16" text-anchor="middle" fill="#eafff8" font-family="DejaVu Sans, sans-serif" font-weight="700" font-size="52">87</text>
  <text x="0" y="38" text-anchor="middle" fill="#29e6a3" font-family="DejaVu Sans Mono, monospace" font-weight="700" font-size="14">/ 100 PTS</text>

  <!-- Status Badge -->
  <rect x="-65" y="58" width="130" height="26" rx="6" fill="#0c2e26" stroke="#29e6a3" stroke-width="1.5"/>
  <text x="0" y="75" text-anchor="middle" fill="#29e6a3" font-family="DejaVu Sans Mono, monospace" font-weight="700" font-size="11">STRONG EVIDENCE</text>
</g>

<!-- Footer -->
<text x="42" y="442" fill="#5f938a" font-family="DejaVu Sans Mono, monospace" font-size="12">Adding or deleting evidence → verification recalculation → updated persisted result</text>
</svg>